name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'android/**'
      - 'assets/**'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout ----------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Node.js ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ---------- Java ----------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- Android SDK ----------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------- Зависимости ----------
      - name: Install dependencies
        run: npm install

      # ---------- Capacitor ----------
      - name: Install Capacitor
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Copy Capacitor config
        run: cp android/capacitor.config.json capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Replace AndroidManifest
        run: |
          cp android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          echo "--- AndroidManifest.xml ---"
          head -40 android/app/src/main/AndroidManifest.xml

      # ---------- Иконки (если есть) ----------
      - name: Generate icons
        if: hashFiles('assets/icon.png') != ''
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android

      # ---------- Синхронизация ----------
      - name: Sync Capacitor
        run: npx cap sync android

      # ---------- Сборка APK ----------
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ---------- Переименование ----------
      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/revers-${GITHUB_RUN_NUMBER}.apk
          ls -lh artifacts/

      # ---------- Загрузка ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: revers-apk-${{ github.run_number }}
          path: artifacts/*.apk
          retention-days: 30
